version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm config set "@fortawesome:registry" https://npm.fontawesome.com/
        - npm config set "//npm.fontawesome.com/:_authToken" $FONT_AWESOME_AUTH_TOKEN
        - npm install
    build:
      commands:
        - if [ -n "$AWS_PULL_REQUEST_ID" ]; then . ./scripts/amplify-preview-env.sh; fi; npm run build-frontend
  artifacts:
    baseDirectory: frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
