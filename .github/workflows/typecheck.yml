name: Typecheck

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Authenticate with Font Awesome npm registry
        run: |
          npm config set "@fortawesome:registry" https://npm.fontawesome.com/
          npm config set "//npm.fontawesome.com/:_authToken" ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate brand files
        run: npm run brand-web

      - name: Build common declarations
        run: npx tsc -p common/tsconfig.json

      - name: Run typecheck
        run: npm run typecheck

      # Catalog COVERAGE + parity. i18n:check alone only compares the catalogs to each other, so a
      # t() key missing from ALL of them (a new UI string shipped on its inline default) passes
      # unnoticed and renders untranslated for ja/de/es. So first re-extract from source: any
      # missing key changes a catalog and the clean-diff check fails until it is committed. Then
      # i18n:check verifies parity, no dead keys, and non-empty English. After typecheck so a
      # broken build reports first.
      - name: Check translation catalogs
        run: |
          npm run i18n:extract -w=frontend
          git diff --exit-code -- frontend/src/i18n/locales || (echo "::error::Untracked i18n keys — run 'npm run i18n:extract -w frontend' and commit." && exit 1)
          npm run i18n:check -w=frontend
