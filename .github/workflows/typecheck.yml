name: Typecheck

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      R3_API_TOKEN: ${{ secrets.R3_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Authenticate with Font Awesome npm registry
        run: |
          npm config set "@fortawesome:registry" https://npm.fontawesome.com/
          npm config set "//npm.fontawesome.com/:_authToken" ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate brand files
        run: npm run brand-web

      - name: Build common declarations
        run: npx tsc -p common/tsconfig.json

      - name: Run typecheck
        run: npm run typecheck

      # frontend/src/platforms/catalogue.generated.json is a build-time SNAPSHOT of the API's
      # platform catalogue (the app reads only that file). This regenerates it and fails when the
      # committed snapshot has drifted from the API. It needs a JWT the API's Bearer path accepts,
      # which is short-lived — a durable CI credential is an open item (access-key signature or a
      # scheduled regeneration job) — so until R3_API_TOKEN is set the step is skipped, and while
      # the API serves no catalogue yet (flag off) the script reports and passes.
      - name: Platform catalogue snapshot is up to date
        if: env.R3_API_TOKEN != ''
        timeout-minutes: 2
        run: npm run platforms:check
