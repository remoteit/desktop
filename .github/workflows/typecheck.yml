name: Typecheck

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Authenticate with Font Awesome npm registry
        run: |
          npm config set "@fortawesome:registry" https://npm.fontawesome.com/
          npm config set "//npm.fontawesome.com/:_authToken" ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate brand files
        run: npm run brand-web

      - name: Build common declarations
        run: npx tsc -p common/tsconfig.json

      - name: Run typecheck
        run: npm run typecheck

      # The platform catalogue (frontend/src/platforms/catalogue.generated.ts) is generated
      # from the GraphQL API and committed as the startup fallback. This fails the build when
      # it drifts from the API. It needs a read token; until R3_API_TOKEN is set as a secret
      # (once the catalogue is live server-side) the step reports and skips instead of failing.
      - name: Platform catalogue is up to date
        env:
          R3_API_TOKEN: ${{ secrets.R3_API_TOKEN }}
        run: |
          if [ -z "$R3_API_TOKEN" ]; then echo "::notice::R3_API_TOKEN not set — skipping platform catalogue check"; exit 0; fi
          npm run platforms:check

      # Catalog parity: fails on a key missing from ja/de/es, a dead key, or an
      # empty English value. Runs after typecheck so a broken build reports first.
      - name: Check translation catalogs
        run: npm run i18n:check -w=frontend
