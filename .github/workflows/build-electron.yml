name: Build / Electron

on: 
  workflow_dispatch:
    inputs:
      brand:
        description: 'Brand to build'
        required: false
        type: choice
        default: 'remoteit'
        options:
          - remoteit
          - cachengo
      skip_signing:
        description: 'Skip code signing'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CI: ''
  FONT_AWESOME_AUTH_TOKEN: ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}
  SKIP_SIGNING: ${{ inputs.skip_signing }}
  BRAND: ${{ inputs.brand || 'remoteit' }}

jobs:
  # Creates the draft before the runners start: electron-builder otherwise creates it lazily
  # and racing runners have produced two drafts for one version. See RELEASE.md, section 2.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      release_repo: ${{ steps.repo.outputs.RELEASE_REPO }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      # A brand may publish to its own repository (brands/<brand>/config.ts); every gh call targets it.
      - name: Resolve the release repository for the brand
        id: repo
        run: echo "RELEASE_REPO=$(node electron/scripts/release-repo.js)" >> $GITHUB_OUTPUT

      # Only a tag build publishes, and only another repository needs a token of its own.
      - name: Check write access to the brand's repository
        if: github.ref_type == 'tag' && steps.repo.outputs.RELEASE_REPO != github.repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: ${{ steps.repo.outputs.RELEASE_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ "$(gh api "repos/$RELEASE_REPO" -q .permissions.push 2>/dev/null)" != "true" ]; then
            echo "::error::RELEASE_TOKEN cannot write to $RELEASE_REPO. Set it to a token with write access there, or run this workflow from that repository."
            exit 1
          fi

      - name: Create the draft release once
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ steps.repo.outputs.RELEASE_REPO != github.repository && secrets.RELEASE_TOKEN || secrets.github_token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          RELEASE_REPO: ${{ steps.repo.outputs.RELEASE_REPO }}
        run: |
          if view=$(gh release view "$VERSION" --repo "$RELEASE_REPO" --json isDraft 2>&1); then
            echo "release $VERSION already exists in $RELEASE_REPO"
          elif [[ "$view" == *"release not found"* ]]; then
            # --target must name a commit the destination repository has.
            target=()
            [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ] && target=(--target "$GITHUB_SHA")
            gh release create "$VERSION" --repo "$RELEASE_REPO" --draft --title "${VERSION#v}" --notes "" "${target[@]}"
          else
            echo "::error::Could not look up release $VERSION in $RELEASE_REPO: $view"
            exit 1
          fi

  release:
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ needs.prepare.outputs.release_repo != github.repository && secrets.RELEASE_TOKEN || secrets.github_token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPO: ${{ needs.prepare.outputs.release_repo }}

    strategy:
      # One platform failing should not cancel the others - a Linux packaging
      # error tells you nothing about whether macOS and Windows are healthy,
      # and a release needs all three.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set npm version
        run: npm install -g npm@10

      - name: Authenticate with fontawesome NPM repo
        run: |
          npm config set "@fortawesome:registry" https://npm.fontawesome.com/
          npm config set "//npm.fontawesome.com/:_authToken" ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Install SSL.com Sign Tool on Windows
        shell: bash
        if: matrix.os == 'windows-latest' && !inputs.skip_signing
        run: |
          curl https://www.ssl.com/download/codesigntool-for-windows/ --output ~/Downloads/CodeSignTool.zip
          unzip ~/Downloads/CodeSignTool.zip -d ~/CodeSignTool

      - name: Install dependencies and build web assets
        run: |
          npm install

      # Linux build
      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd electron
          npm run build

      # macOS build
      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-14'
        env:
          CSC_LINK: ${{ secrets.mac_certs }}
          CSC_KEY_PASSWORD: ${{ secrets.mac_certs_password }}
        run: |
          cd electron
          npm run build

      # Windows build
      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd electron
          npm run build

      # nsis7z silently skips payload entries it cannot decode (3.47.1/3.48.1 ARM64). electron-builder
      # has already attached the installers to the draft, so a failure pulls them back out.
      - name: Verify Windows installers extract with nsis7z
        if: matrix.os == 'windows-latest'
        run: |
          cd electron
          if ! node scripts/verify-win-installers.js dist; then
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$(gh release view "$VERSION" --repo "$RELEASE_REPO" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
              for f in dist/*-Installer-*.exe dist/*-Installer-*.exe.blockmap dist/latest.yml; do
                [ -e "$f" ] && gh release delete-asset "$VERSION" "$(basename "$f")" --repo "$RELEASE_REPO" --yes 2>/dev/null || true
              done
              echo "::error::Windows installers removed from draft $VERSION in $RELEASE_REPO - their payload cannot be extracted by nsis7z (see above)"
            fi
            exit 1
          fi

      # Pins the ia32-first order old clients depend on and writes latest-<arch>.yml, replacing
      # what electron-builder attached to the draft. See RELEASE.md, "Windows update manifests".
      - name: Finalize Windows update manifests
        if: matrix.os == 'windows-latest'
        run: |
          set -o pipefail
          cd electron
          node scripts/finalize-win-update-manifests.js dist | tee manifests.txt
          # Only a tag build published anything, and only into a draft; a live release is never rewritten.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::notice::electron-builder does not publish from a branch. Manifests were generated but not uploaded."
            exit 0
          fi
          state=$(gh release view "$VERSION" --repo "$RELEASE_REPO" --json isDraft -q 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo missing)
          case "$state" in
            draft)
              # gh picks one draft by tag; if the runners raced and made several, the
              # manifests could land in a draft without the installers. Refuse instead.
              drafts=$(gh api "repos/$RELEASE_REPO/releases?per_page=100" -q "[.[] | select(.tag_name==\"$VERSION\" and .draft)] | length")
              if [ "$drafts" != "1" ]; then
                echo "::error::$drafts draft releases are tagged $VERSION. Keep one, delete the rest, and re-run - see RELEASE.md."
                exit 1
              fi
              gh release upload "$VERSION" $(cat manifests.txt) --repo "$RELEASE_REPO" --clobber ;;
            published)
              echo "::error::$VERSION is already published in $RELEASE_REPO. CI never rewrites a live release's update manifests - bump the version."
              exit 1 ;;
            missing)
              echo "::error::Release $VERSION not found in $RELEASE_REPO although building tag $GITHUB_REF_NAME"
              exit 1 ;;
          esac
