name: Build / Electron

on: 
  workflow_dispatch:
    inputs:
      brand:
        description: 'Brand to build'
        required: false
        type: choice
        default: 'remoteit'
        options:
          - remoteit
          - cachengo
      skip_signing:
        description: 'Skip code signing'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CI: ''
  FONT_AWESOME_AUTH_TOKEN: ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}
  SKIP_SIGNING: ${{ inputs.skip_signing }}
  BRAND: ${{ inputs.brand || 'remoteit' }}
  # A brand's release publishes to the brand's own repository, which the automatic token
  # cannot reach; RELEASE_TOKEN (optional) supplies one that can.
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.github_token }}

jobs:
  # electron-builder creates the GitHub draft lazily, from whichever upload finishes
  # first. Three runners racing on "release doesn't exist" have produced two drafts
  # for one version with the installers split between them - publishing either ships
  # an incomplete release. Create the draft once, up front, so every runner finds it.
  # Only on a tag build: that is the only case electron-builder publishes at all.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_repo: ${{ steps.repo.outputs.RELEASE_REPO }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      # A branded build publishes to the brand's repository (brands/<brand>/config.ts),
      # not necessarily the one this workflow runs in. Every gh call below targets it.
      - name: Resolve the release repository for the brand
        id: repo
        run: |
          RELEASE_REPO=$(node electron/scripts/release-repo.js)
          if [ "$RELEASE_REPO" != "$GITHUB_REPOSITORY" ] && [ "$(gh api "repos/$RELEASE_REPO" -q .permissions.push 2>/dev/null)" != "true" ]; then
            echo "::error::GH_TOKEN cannot write to $RELEASE_REPO. Run this workflow from that repository, or set the RELEASE_TOKEN secret to a token with write access there."
            exit 1
          fi
          echo "RELEASE_REPO=$RELEASE_REPO" >> $GITHUB_OUTPUT

      - name: Create the draft release once
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          RELEASE_REPO: ${{ steps.repo.outputs.RELEASE_REPO }}
        run: |
          if gh release view "$VERSION" --repo "$RELEASE_REPO" --json isDraft >/dev/null 2>&1; then
            echo "release $VERSION already exists in $RELEASE_REPO"
          else
            # --target must name a commit the destination repository has; another brand's
            # repository need not contain this one, so leave it to the tag or default branch there.
            target=()
            [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ] && target=(--target "$GITHUB_SHA")
            gh release create "$VERSION" --repo "$RELEASE_REPO" --draft --title "${VERSION#v}" --notes "" "${target[@]}"
          fi

  release:
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not cancel the others - a Linux packaging
      # error tells you nothing about whether macOS and Windows are healthy,
      # and a release needs all three.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set npm version
        run: npm install -g npm@10

      - name: Authenticate with fontawesome NPM repo
        run: |
          npm config set "@fortawesome:registry" https://npm.fontawesome.com/
          npm config set "//npm.fontawesome.com/:_authToken" ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Install SSL.com Sign Tool on Windows
        shell: bash
        if: matrix.os == 'windows-latest' && !inputs.skip_signing
        run: |
          curl https://www.ssl.com/download/codesigntool-for-windows/ --output ~/Downloads/CodeSignTool.zip
          unzip ~/Downloads/CodeSignTool.zip -d ~/CodeSignTool

      - name: Install dependencies and build web assets
        run: |
          npm install

      # Linux build
      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd electron
          npm run build

      # macOS build
      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-14'
        env:
          CSC_LINK: ${{ secrets.mac_certs }}
          CSC_KEY_PASSWORD: ${{ secrets.mac_certs_password }}
        run: |
          cd electron
          npm run build

      # Windows build
      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd electron
          npm run build

      # nsis7z (built 2019) silently skips payload entries compressed with a coder it does
      # not know; electron-builder 26.15's 7-Zip used the ARM64 filter on ARM64 executables
      # and every 3.47.1/3.48.1 ARM64 install lost its binaries. package.json forces BCJ2;
      # this proves each installer's payload. electron-builder has already attached the
      # installers to the draft, so on failure they are removed before anyone can publish.
      - name: Verify Windows installers extract with nsis7z
        if: matrix.os == 'windows-latest'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          RELEASE_REPO: ${{ needs.prepare.outputs.release_repo }}
        run: |
          cd electron
          if ! node scripts/verify-win-installers.js dist; then
            if [ "$(gh release view "$VERSION" --repo "$RELEASE_REPO" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
              for f in dist/*-Installer-*.exe dist/*-Installer-*.exe.blockmap dist/latest.yml; do
                [ -e "$f" ] && gh release delete-asset "$VERSION" "$(basename "$f")" --repo "$RELEASE_REPO" --yes 2>/dev/null || true
              done
              echo "::error::Windows installers removed from draft $VERSION in $RELEASE_REPO - their payload cannot be extracted by nsis7z (see above)"
            fi
            exit 1
          fi

      # electron-builder orders `files` in latest.yml by build completion, and every
      # client on electron-updater <= 6.6.2 (all releases through 3.46.1) installs
      # whatever is first. Make the order deterministic, write the per-arch manifests
      # an emulated build uses to reach its native installer, and replace what
      # electron-builder already attached. See RELEASE.md, "Windows update manifests".
      - name: Finalize Windows update manifests
        if: matrix.os == 'windows-latest'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          RELEASE_REPO: ${{ needs.prepare.outputs.release_repo }}
        run: |
          set -o pipefail
          cd electron
          node scripts/finalize-win-update-manifests.js dist | tee manifests.txt
          # Upload only into the DRAFT release electron-builder publishes to. A published
          # release is never rewritten from CI - electron-builder refuses that case too -
          # so a version that is already live fails the job instead of touching it.
          # A branch build creates no release at all and has nothing to upload to.
          state=$(gh release view "$VERSION" --repo "$RELEASE_REPO" --json isDraft -q 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo missing)
          case "$state" in
            draft)
              # gh picks one draft by tag; if the runners raced and made several, the
              # manifests could land in a draft without the installers. Refuse instead.
              drafts=$(gh api "repos/$RELEASE_REPO/releases?per_page=100" -q "[.[] | select(.tag_name==\"$VERSION\" and .draft)] | length")
              if [ "$drafts" != "1" ]; then
                echo "::error::$drafts draft releases are tagged $VERSION. Keep one, delete the rest, and re-run - see RELEASE.md."
                exit 1
              fi
              gh release upload "$VERSION" $(cat manifests.txt) --repo "$RELEASE_REPO" --clobber ;;
            published)
              echo "::error::$VERSION is already published in $RELEASE_REPO. CI never rewrites a live release's update manifests - bump the version."
              exit 1 ;;
            missing)
              if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                echo "::error::Release $VERSION not found in $RELEASE_REPO although building tag $GITHUB_REF_NAME"
                exit 1
              fi
              echo "::notice::No $VERSION release - electron-builder does not publish from a branch. Manifests were generated but not uploaded." ;;
          esac
