name: Mirror main to next

# `next` is `main`, built by Amplify (the app.remote.it app's `next` branch) with PRODUCTION's issuer and API in its
# branch environment, and served at app.next.remote.it: the pre-promotion portal, signed into and run against
# production (the e2e `prod2` lane) before it becomes app.remote.it. Amplify keys a branch's settings to a git branch, so
# the same commit needs a second branch name; this keeps that name equal to `main` on every push and nobody edits it.
#
# A push made with the workflow's GITHUB_TOKEN starts no other workflow, but repository webhooks still fire, so
# Amplify's webhook builds `next` as it builds `main`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-next
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # A force push, so `next` is always exactly `main`, even after a history rewrite on main.
      - name: Push main to next
        run: git push --force origin "refs/remotes/origin/main:refs/heads/next"
